name: EV Shadow Daily Results

on:
  schedule:
    # GitHub scheduled runs can be delayed or dropped.  Retry through late
    # morning; the persisted `through` state keeps delivery idempotent.
    - cron: "30,37,52 22 * * *"
    - cron: "7,22,37,52 23,0,1,2 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/shadow-ev-results.yml"
      - "shadow_ev_notify.js"
      - "scripts/audit-trifecta-ev-shadow.py"
      - "scripts/score-trifecta-ev-shadow.py"
  workflow_dispatch:
    inputs:
      through:
        description: "Last settled YYYYMMDD date (default: yesterday in JST)"
        required: false
        type: string
      test_notification:
        description: "Send a connection test to the dedicated Discord room"
        required: false
        default: false
        type: boolean

concurrency:
  group: ev-shadow-daily-main
  cancel-in-progress: false

jobs:
  audit-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve audit date
        run: |
          if [ -n "${{ github.event.inputs.through }}" ]; then
            THROUGH="${{ github.event.inputs.through }}"
          else
            THROUGH="$(TZ=Asia/Tokyo date -d 'yesterday' +%Y%m%d)"
          fi
          echo "THROUGH=$THROUGH" >> "$GITHUB_ENV"
          if [ "$THROUGH" -lt 20260825 ]; then
            echo "SHADOW_ACTIVE=false" >> "$GITHUB_ENV"
          else
            echo "SHADOW_ACTIVE=true" >> "$GITHUB_ENV"
          fi

      - name: Test dedicated Discord room
        if: github.event_name == 'workflow_dispatch' && inputs.test_notification == true
        env:
          SHADOW_DISCORD_WEBHOOK_URL: ${{ secrets.SHADOW_DISCORD_WEBHOOK_URL }}
          SHADOW_TEST: "1"
        run: node shadow_ev_notify.js

      - name: Restore shadow cache
        if: env.SHADOW_ACTIVE == 'true' && inputs.test_notification != true
        uses: actions/cache@v4
        with:
          path: .shadow-cache
          key: ${{ runner.os }}-shadow-v1-${{ env.THROUGH }}
          restore-keys: |
            ${{ runner.os }}-shadow-v1-

      - name: Check prior delivery
        if: env.SHADOW_ACTIVE == 'true' && inputs.test_notification != true
        run: |
          NOTIFIED_THROUGH="$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.shadow-cache/last-summary.json')
          try:
              print(json.loads(path.read_text()).get('through', ''))
          except Exception:
              print('')
          PY
          )"
          if [ "$NOTIFIED_THROUGH" = "$THROUGH" ]; then
            echo "SHADOW_ALREADY_NOTIFIED=true" >> "$GITHUB_ENV"
            echo "Already notified through $THROUGH; retry exits cleanly."
          else
            echo "SHADOW_ALREADY_NOTIFIED=false" >> "$GITHUB_ENV"
          fi

      - name: Install analysis dependency
        if: env.SHADOW_ACTIVE == 'true' && env.SHADOW_ALREADY_NOTIFIED != 'true' && inputs.test_notification != true
        run: python -m pip install numpy

      - name: Audit Champion v1
        if: env.SHADOW_ACTIVE == 'true' && env.SHADOW_ALREADY_NOTIFIED != 'true' && inputs.test_notification != true
        run: |
          python scripts/audit-trifecta-ev-shadow.py \
            --through "$THROUGH" \
            --snapshot-dir .shadow-cache/snapshots

      - name: Notify dedicated Discord room
        if: env.SHADOW_ACTIVE == 'true' && env.SHADOW_ALREADY_NOTIFIED != 'true' && inputs.test_notification != true
        env:
          SHADOW_DISCORD_WEBHOOK_URL: ${{ secrets.SHADOW_DISCORD_WEBHOOK_URL }}
          SHADOW_REPORT: artifacts/trifecta-ev-shadow-audit-${{ env.THROUGH }}.json
          SHADOW_STATE_FILE: .shadow-cache/last-summary.json
          SHADOW_THROUGH: ${{ env.THROUGH }}
        run: node shadow_ev_notify.js

      - name: Notify Discord when the audit fails
        if: failure() && env.SHADOW_ACTIVE == 'true' && env.SHADOW_ALREADY_NOTIFIED != 'true' && inputs.test_notification != true
        env:
          SHADOW_DISCORD_WEBHOOK_URL: ${{ secrets.SHADOW_DISCORD_WEBHOOK_URL }}
          SHADOW_FAILURE: "1"
          SHADOW_THROUGH: ${{ env.THROUGH }}
        run: node shadow_ev_notify.js

      - name: Upload shadow audit
        if: always() && env.SHADOW_ACTIVE == 'true' && env.SHADOW_ALREADY_NOTIFIED != 'true' && inputs.test_notification != true
        uses: actions/upload-artifact@v4
        with:
          name: shadow-ev-audit-${{ env.THROUGH }}
          path: artifacts/trifecta-ev-shadow-audit-${{ env.THROUGH }}.json
          if-no-files-found: warn
          retention-days: 90
